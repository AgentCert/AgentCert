---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo-chaos
  namespace: #{INFRA_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-chaos-infra-role-binding
  namespace: #{INFRA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-role
subjects:
  - kind: ServiceAccount
    name: argo-chaos
    namespace: #{INFRA_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-chaos-ops-role-binding
  namespace: #{INFRA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infra-ops-role
subjects:
  - kind: ServiceAccount
    name: argo-chaos
    namespace: #{INFRA_NAMESPACE}
---
# cluster-admin is required so the Helm install-app/install-agent steps can
# create ClusterRole and ClusterRoleBinding objects shipped by app charts
# (e.g. Prometheus and kube-state-metrics RBAC in the sock-shop chart).
# Name is namespace-scoped to remain unique across multiple infra registrations.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argo-chaos-admin-#{INFRA_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: argo-chaos
    namespace: #{INFRA_NAMESPACE}