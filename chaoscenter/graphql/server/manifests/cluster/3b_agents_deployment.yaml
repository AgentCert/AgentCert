---
apiVersion: v1
kind: ConfigMap
metadata:
  name: subscriber-config
  namespace: #{INFRA_NAMESPACE}
data:
  SERVER_ADDR: #{SERVER_ADDR}
  INFRA_SCOPE: #{INFRA_SCOPE}
  VERSION: #{VERSION}
  START_TIME: #{START_TIME}
  SKIP_SSL_VERIFY: "#{SKIP_SSL_VERIFY}"
  CUSTOM_TLS_CERT: "#{CUSTOM_TLS_CERT}"
  IS_INFRA_CONFIRMED: #{IS_INFRA_CONFIRMED}
  # Comma-separated namespace allowlist the subscriber resolves via individual
  # Get calls instead of a cluster-wide List (see infra-cluster-role in
  # 3a_agents_rbac.yaml — RBAC only grants `get` on exactly these names).
  # Populated dynamically by ManifestParser from the app-charts catalog.
  TARGET_APP_NAMESPACES: "#{TARGET_APP_NAMESPACES}"
  COMPONENTS: |
    DEPLOYMENTS: #{INFRA_DEPLOYMENTS}
---
apiVersion: v1
kind: Secret
metadata:
  name: subscriber-secret
  namespace: #{INFRA_NAMESPACE}
stringData:
  INFRA_ID: #{INFRA_ID}
  ACCESS_KEY: #{ACCESS_KEY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber
  namespace: #{INFRA_NAMESPACE}
  labels:
    app: subscriber
spec:
  selector:
    matchLabels:
      app: subscriber
  template:
    metadata:
      labels:
        app: subscriber
    spec:
      serviceAccountName: #{INFRA_SERVICE_ACCOUNT}
      #{TOLERATIONS}
      #{NODE_SELECTOR}
      containers:
        - name: subscriber
          image: #{SUBSCRIBER_IMAGE}
          # IfNotPresent (not Always): #{SUBSCRIBER_IMAGE} resolves to a fixed tag
          # (agentcert/litmusportal-subscriber:<version>, not :latest), and local dev
          # relies on `kind load docker-image` to get a freshly-built copy onto the
          # node under that same tag. Always defeats that -- kubelet re-pulls from
          # Docker Hub on every pod recreation, silently discarding the freshly
          # loaded local image and replacing it with whatever's published under that
          # tag upstream, even when a local rebuild just landed the fix moments
          # earlier (see OPEN_WEIGHT_CERTIFICATION_HANDOFF.md).
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 2000
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: subscriber-config
            - secretRef:
                name: subscriber-secret
          env:
            - name: INFRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "300Mi"
              cpu: "125m"
              ephemeral-storage: "500Mi"
            limits:
              memory: "500Mi"
              cpu: "225m"
              ephemeral-storage: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: event-tracker
  name: event-tracker
  namespace: #{INFRA_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-tracker
  template:
    metadata:
      labels:
        app: event-tracker
    spec:
      #{TOLERATIONS}
      #{NODE_SELECTOR}
      serviceAccountName: #{INFRA_SERVICE_ACCOUNT}
      containers:
        - image: #{EVENT_TRACKER_IMAGE}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 2000
            allowPrivilegeEscalation: false
          name: event-tracker
          envFrom:
            - configMapRef:
                name: subscriber-config
            - secretRef:
                name: subscriber-secret
          env:
            - name: INFRA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: "300Mi"
              cpu: "125m"
              ephemeral-storage: "500Mi"
            limits:
              memory: "500Mi"
              cpu: "225m"
              ephemeral-storage: "1Gi"